name: test seqseg build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: [3.11, 3.12]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU PyTorch
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          # The default Linux torch wheel depends on cuda-toolkit and nvidia-*-cu13.
          # These jobs only check the CLI, so the CPU wheels are enough.
          python -m pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --upgrade-strategy only-if-needed .

      - name: Run CLI test
        run: |
          seqseg --help

  pytest:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.11, 3.12]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          # The default Linux torch wheel depends on cuda-toolkit and nvidia-*-cu13.
          # The test suite does not need a GPU.
          python -m pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install package and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir --upgrade-strategy only-if-needed '.[dev]'

      - name: Run pytest
        run: pytest -q

